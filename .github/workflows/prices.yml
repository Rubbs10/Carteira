name: Atualizar preços
on:
  schedule:
    - cron: "*/15 7-21 * * 1-5"
  workflow_dispatch: {}
concurrency: prices
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job/requirements.txt
      - run: pip install -r job/requirements.txt
      - run: python job/update_prices.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
